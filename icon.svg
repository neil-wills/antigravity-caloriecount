<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    
    <!-- Accent Ring Gradient (Teal/Emerald) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Plate Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glowing Accent Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.3" />

  <!-- Main Plate Shadow & Shape -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Inner Rim of Plate -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#f1f5f9" stroke-width="6" />

  <!-- Calorie Target Indicator Circle (overlapping the plate) -->
  <path d="M 256,126 A 130,130 0 1,1 126,256" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" />

  <!-- Leaf Shape in Center (representing health & nutrition) -->
  <path d="M 256,210 C 285,210 300,235 300,265 C 300,295 270,302 256,302 C 242,302 212,295 212,265 C 212,235 227,210 256,210 Z" fill="url(#accentGrad)" />
  <!-- Leaf Stem details -->
  <path d="M 256,302 C 256,260 256,240 256,220" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 256,260 Q 275,250 280,240" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M 256,280 Q 235,270 230,260" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

</svg>
