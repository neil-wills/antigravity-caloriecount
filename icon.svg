<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    
    <!-- Toast Gradients -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="avoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="215" fill="#0d9488" opacity="0.05" />

  <!-- Main Dining Plate -->
  <circle cx="256" cy="256" r="148" fill="url(#plateGrad)" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#f1f5f9" stroke-width="5" />

  <!-- Calorie Counter Progress Ring around Plate -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#e2e8f0" stroke-width="8" opacity="0.4" />
  <!-- A completed calorie ring arc representing tracked progress -->
  <path d="M 256,84 A 172,172 0 1,1 110,348" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Cutlery: Fork on left, Knife on right -->
  <!-- Fork -->
  <g stroke="#64748b" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 188,200 v 50 M 178,200 v 35 M 198,200 v 35 M 178,235 q 0,15 10,15 q 10,0 10,-15 M 188,250 v 62" />
  </g>
  <!-- Knife -->
  <g stroke="#64748b" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 324,200 v 112 M 324,200 q -10,10 -10,35 v 25 q 0,5 10,5 Z" fill="#94a3b8" />
  </g>

  <!-- Avocado Toast Illustration in Plate Center -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <!-- Crust (Outer Bread Border) -->
    <path d="M 210,210 C 210,185 228,175 256,175 C 284,175 302,185 302,210 V 275 C 302,290 280,300 256,300 C 232,300 210,290 210,275 Z" fill="url(#crustGrad)" />
    
    <!-- Crumb (Inner Bread Body) -->
    <path d="M 215,215 C 215,193 230,183 256,183 C 282,183 297,193 297,215 V 270 C 297,283 278,292 256,292 C 234,292 215,283 215,270 Z" fill="url(#crumbGrad)" />

    <!-- Creamy Avocado Spread Layer -->
    <path d="M 220,220 Q 235,210 256,210 T 292,220 V 265 Q 275,285 256,285 T 220,265 Z" fill="url(#avoGrad)" />

    <!-- Cherry Tomato Slices -->
    <!-- Tomato 1 -->
    <circle cx="240" cy="232" r="12" fill="#ef4444" />
    <circle cx="240" cy="232" r="8" fill="#dc2626" />
    <circle cx="238" cy="230" r="3" fill="#fca5a5" opacity="0.7" />
    
    <!-- Tomato 2 -->
    <circle cx="272" cy="262" r="12" fill="#ef4444" />
    <circle cx="272" cy="262" r="8" fill="#dc2626" />
    <circle cx="270" cy="260" r="3" fill="#fca5a5" opacity="0.7" />

    <!-- Seasoning Flakes (Pepper and Sesame seeds) -->
    <circle cx="248" cy="254" r="2" fill="#1e293b" />
    <circle cx="264" cy="226" r="1.8" fill="#1e293b" />
    <circle cx="258" cy="272" r="2" fill="#1e293b" />
    <circle cx="282" cy="242" r="2.2" fill="#1e293b" />
    
    <circle cx="232" cy="262" r="1.8" fill="#ffffff" />
    <circle cx="252" cy="216" r="2" fill="#ffffff" />
    <circle cx="278" cy="224" r="1.8" fill="#ffffff" />
    <circle cx="280" cy="274" r="2" fill="#ffffff" />
  </g>
</svg>
