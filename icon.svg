<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Accents -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d9488" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="215" fill="#0d9488" opacity="0.05" />

  <!-- Main Dining Plate -->
  <circle cx="256" cy="256" r="148" fill="url(#plateGrad)" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#f1f5f9" stroke-width="5" />

  <!-- Calorie Counter Progress Ring around Plate -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#e2e8f0" stroke-width="8" opacity="0.4" />
  <!-- A completed calorie ring arc representing tracked progress -->
  <path d="M 256,84 A 172,172 0 1,1 110,348" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Cutlery: Fork on left, Knife on right -->
  <!-- Fork -->
  <g stroke="#64748b" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 190,200 v 50 M 180,200 v 35 M 200,200 v 35 M 180,235 q 0,15 10,15 q 10,0 10,-15 M 190,250 v 62" />
  </g>
  <!-- Knife -->
  <g stroke="#64748b" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 322,200 v 112 M 322,200 q -10,10 -10,35 v 25 q 0,5 10,5 Z" fill="#94a3b8" />
  </g>

  <!-- Healthy Green Salad Leaf / Avocado in Center -->
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- Main leaf -->
    <path d="M 256,180 C 290,180 305,215 305,250 C 305,285 280,295 256,295 C 232,295 207,285 207,250 C 207,215 222,180 256,180 Z" fill="url(#leafGrad)" />
    <!-- Leaf details -->
    <path d="M 256,295 C 256,245 256,220 256,200" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 256,250 Q 278,238 285,225" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 256,270 Q 234,258 227,245" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
